[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackmamba-righthand"
version = "0.1.0"
description = "Semantic browser-action assistant with human safety gates"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.48,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
righthand = "righthand.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
